<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="100%" height="auto" style="max-width: 780px; display: block; margin: 1.5rem auto;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <!-- Main Background -->
    <rect x="1" y="1" width="778" height="368" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 1,11 A 10,10 0 0,1 11,1 L 769,1 A 10,10 0 0,1 779,11 L 779,38 L 1,38 Z" fill="url(#headerGrad)"/>
    <line x1="1" y1="38" x2="779" y2="38" stroke="#30363d" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="18" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="38" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="58" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Window Title -->
    <text x="390.0" y="23" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.3">ephemvm — Destructive Teardown & Root Deletion Test</text>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 60)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" line-height="1.5">

      <!-- Command Prompt Line -->
      <text y="0">
        <tspan fill="#7ee787" font-weight="bold">user@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan>
        <tspan fill="#f0883e" font-weight="bold">ephemvm</tspan><tspan fill="#e6edf3"> "rm -rf --no-preserve-root / &amp;&amp; ls -la /"</tspan>
      </text>

      <!-- Guest execution -->
      <text y="28" fill="#f85149">
        rm: cannot remove '/proc/1': Operation not permitted
      </text>
      <text y="50" fill="#f85149">
        rm: cannot remove '/sys/fs/cgroup': Operation not permitted
      </text>
      <text y="72" fill="#d29922">
        ls: /: No such file or directory
      </text>

      <!-- Teardown & Verification -->
      <text y="108" fill="#8b949e">
        <tspan fill="#58a6ff">ℹ</tspan> [ephemvm] guest exited with status 1
      </text>
      <text y="132" fill="#8b949e">
        <tspan fill="#3fb950">✓</tspan> [ephemvm] overlay /tmp/ephemvm-9a3d discarded completely
      </text>
      <text y="156" fill="#8b949e">
        <tspan fill="#3fb950">✓</tspan> [ephemvm] base rootfs ~/.cache/ephemvm/rootfs.ext4 SHA256 verified untouched
      </text>

      <!-- Second verify command -->
      <text y="196">
        <tspan fill="#7ee787" font-weight="bold">user@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan>
        <tspan fill="#f0883e" font-weight="bold">ephemvm</tspan><tspan fill="#e6edf3"> "ls /"</tspan>
      </text>
      <text y="224" fill="#79c0ff">
        bin  boot  dev  etc  home  lib  media  mnt  opt  proc  root  run  sbin  srv  sys  tmp  usr  var
      </text>

    </g>


    <!-- Terminal Footer Status Bar -->
    <rect x="1" y="338" width="778" height="31" fill="#161b22" rx="0 0 10 10"/>
    <line x1="1" y1="338" x2="779" y2="338" stroke="#30363d" stroke-width="1"/>

      <text x="24" y="358" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
        💥 GUEST DISK: Annihilated
      </text>
      <text x="200" y="358" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
        🛡 HOST DISK: 100% Intact
      </text>
      <text x="756" y="358" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="end">
        CoW Reflink Rollback
      </text>


  </g>
</svg>
