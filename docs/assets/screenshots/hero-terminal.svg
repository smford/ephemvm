<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="100%" height="auto" style="max-width: 780px; display: block; margin: 1.5rem auto;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <g filter="url(#shadow)">
    <!-- Main Background -->
    <rect x="1" y="1" width="778" height="358" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M 1,11 A 10,10 0 0,1 11,1 L 769,1 A 10,10 0 0,1 779,11 L 779,38 L 1,38 Z" fill="url(#headerGrad)"/>
    <line x1="1" y1="38" x2="779" y2="38" stroke="#30363d" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="18" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="38" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="58" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Window Title -->
    <text x="390.0" y="23" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.3">ephemvm — Fast Ephemeral MicroVM Runner</text>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 60)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" line-height="1.5">

      <!-- Command Prompt Line -->
      <text y="0">
        <tspan fill="#7ee787" font-weight="bold">user@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan>
        <tspan fill="#f0883e" font-weight="bold">ephemvm</tspan><tspan fill="#e6edf3"> "uname -srm &amp;&amp; uptime"</tspan>
      </text>

      <!-- EphemVM execution notes -->
      <text y="28" fill="#8b949e">
        <tspan fill="#58a6ff">ℹ</tspan> [ephemvm] allocating CoW reflink overlay in /tmp/ephemvm-8f2c...
      </text>
      <text y="52" fill="#8b949e">
        <tspan fill="#58a6ff">ℹ</tspan> [ephemvm] booting Firecracker microVM with 1 vCPU, 128MB RAM...
      </text>

      <!-- Output from microVM -->
      <text y="88" fill="#e6edf3" font-weight="600">
        Linux 6.1.102-ephem x86_64
      </text>
      <text y="112" fill="#e6edf3">
         02:50:11 up 0 min, 0 users, load average: 0.00, 0.00, 0.00
      </text>

      <!-- Teardown -->
      <text y="148" fill="#8b949e">
        <tspan fill="#3fb950">✓</tspan> guest exited cleanly (exit code: 0)
      </text>
      <text y="172" fill="#8b949e">
        <tspan fill="#3fb950">✓</tspan> microVM evaporated, overlay pruned, 0 bytes leaked
      </text>

      <!-- Next prompt -->
      <text y="212">
        <tspan fill="#7ee787" font-weight="bold">user@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$ </tspan>
        <tspan fill="#79c0ff" opacity="0.8">_</tspan>
      </text>

    </g>


    <!-- Terminal Footer Status Bar -->
    <rect x="1" y="328" width="778" height="31" fill="#161b22" rx="0 0 10 10"/>
    <line x1="1" y1="328" x2="779" y2="328" stroke="#30363d" stroke-width="1"/>

      <text x="24" y="348" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
        ⚡ BOOT: 38ms
      </text>
      <text x="124" y="348" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
        ⏱ EXEC: 12ms
      </text>
      <text x="224" y="348" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">
        🛡 ISOLATION: Hardware KVM
      </text>
      <text x="756" y="348" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="end">
        Status: Exit 0 (Success)
      </text>


  </g>
</svg>
